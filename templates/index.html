<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eaf5f8" />
  <title>AI 민원 음성상담</title>

  <style>
    :root {
      --bg-top: #edf8fa;
      --bg-bottom: #f7fafb;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --primary: #227da1;
      --primary-dark: #176483;
      --primary-soft: #dff2f7;
      --primary-glow: rgba(47, 158, 194, 0.24);
      --line: #d8e9ee;
      --text: #183744;
      --muted: #67818c;
      --success: #3f9c7b;
      --danger: #c75468;
      --shadow: 0 18px 45px rgba(42, 91, 108, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(124, 209, 224, 0.27), transparent 34%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 72%);
      color: var(--text);
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app {
      position: relative;
      width: min(100%, 520px);
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(26px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand-label {
      margin-bottom: 4px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 6vw, 30px);
      letter-spacing: -0.045em;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      padding: 8px 11px;
      border: 1px solid #cfe6dc;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: #397c64;
      font-size: 11px;
      font-weight: 750;
      box-shadow: 0 7px 20px rgba(45, 99, 82, 0.07);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(63, 156, 123, 0.12);
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 390px;
      padding: 28px 20px 25px;
      border: 1px solid rgba(201, 228, 235, 0.96);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 39%, rgba(152, 222, 234, 0.19), transparent 31%),
        linear-gradient(150deg, rgba(255, 255, 255, 0.98), rgba(239, 249, 251, 0.94));
      box-shadow: var(--shadow);
      text-align: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      width: 60%;
      height: 3px;
      border-radius: 0 0 999px 999px;
      background: linear-gradient(90deg, transparent, #64bfd6, transparent);
    }

    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 800;
    }

    .welcome-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #48aac6;
    }

    .hero-title {
      margin: 15px 0 7px;
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    .hero-copy {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .orb-wrap {
      position: relative;
      width: 205px;
      height: 205px;
      display: grid;
      place-items: center;
      margin: 13px auto 5px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(55, 158, 190, 0.18);
    }

    .ring.r1 {
      inset: 12px;
      border-top-color: rgba(47, 157, 190, 0.66);
      animation: rotate 10s linear infinite;
    }

    .ring.r2 {
      inset: 32px;
      border-right-color: rgba(66, 128, 189, 0.38);
      animation: rotateReverse 8s linear infinite;
    }

    .ring.r3 {
      inset: 52px;
      border-color: rgba(48, 155, 186, 0.1);
    }

    .mic-button {
      position: relative;
      z-index: 2;
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 30%, #75d8e9, #268bad 52%, #17627f 100%);
      color: #fff;
      box-shadow:
        0 0 0 11px rgba(44, 159, 191, 0.08),
        0 18px 36px rgba(31, 124, 154, 0.24),
        inset 0 2px 7px rgba(255, 255, 255, 0.28);
      cursor: pointer;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .mic-button:active {
      transform: scale(0.96);
    }

    .mic-button svg {
      width: 39px;
      height: 39px;
      fill: currentColor;
    }

    .hero.listening .ring {
      border-color: rgba(37, 151, 187, 0.45);
      animation-duration: 1.5s;
    }

    .hero.listening .mic-button {
      animation: pulse 1.1s ease-in-out infinite;
      box-shadow:
        0 0 0 16px rgba(44, 159, 191, 0.1),
        0 20px 42px rgba(31, 124, 154, 0.34);
    }

    .state-text {
      min-height: 23px;
      margin: 0;
      color: #245b70;
      font-size: 15px;
      font-weight: 800;
    }

    .state-sub {
      min-height: 21px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .panel {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 14px 34px rgba(42, 91, 108, 0.08);
      backdrop-filter: blur(16px);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-title-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .panel-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 17px;
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
      letter-spacing: -0.025em;
    }

    .panel-help {
      color: #77909a;
      font-size: 11px;
    }

    textarea {
      width: 100%;
      min-height: 116px;
      resize: vertical;
      padding: 15px;
      border: 1px solid #d7e8ed;
      border-radius: 17px;
      outline: none;
      background: #fafdfe;
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    textarea:focus {
      border-color: #69b8ce;
      box-shadow: 0 0 0 4px rgba(72, 168, 197, 0.11);
    }

    textarea::placeholder {
      color: #91a6ae;
    }

    .primary-action {
      width: 100%;
      min-height: 55px;
      margin-top: 14px;
      border: 0;
      border-radius: 17px;
      background: linear-gradient(135deg, #287fa1, #236e94);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 12px 26px rgba(34, 113, 148, 0.2);
      cursor: pointer;
    }

    .primary-action:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .answer {
      display: none;
      border-color: #cfe7df;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(247, 252, 250, 0.96));
    }

    .answer.show {
      display: block;
      animation: rise 0.35s ease both;
    }

    .counselor-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .counselor-avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid #cfe5dc;
      border-radius: 15px;
      background: #e7f5ef;
      font-size: 21px;
    }

    .counselor-name {
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 850;
    }

    .counselor-status {
      margin: 0;
      color: #6f887e;
      font-size: 11px;
    }

    .answer-bubble {
      position: relative;
      padding: 17px;
      border: 1px solid #dcece5;
      border-radius: 6px 19px 19px 19px;
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(53, 105, 86, 0.06);
    }

    .answer-body {
      margin: 0;
      color: #28463d;
      font-size: 15px;
      line-height: 1.82;
      white-space: pre-wrap;
    }

    .answer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .secondary-button {
      min-height: 49px;
      border: 1px solid #d1e4e9;
      border-radius: 15px;
      background: #f7fbfc;
      color: #326579;
      font-weight: 780;
      cursor: pointer;
    }

    .secondary-button.stop {
      color: #a94b5d;
      border-color: #ecd5db;
      background: #fffafb;
    }

    .reset-button {
      width: 100%;
      margin-top: 10px;
    }

    .notice {
      margin: 15px 5px 0;
      color: #81969e;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .loader {
      display: none;
      width: 17px;
      height: 17px;
      margin-right: 7px;
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-top-color: #fff;
      border-radius: 50%;
      vertical-align: -3px;
      animation: rotate 0.8s linear infinite;
    }

    .primary-action.loading .loader {
      display: inline-block;
    }

    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      width: calc(100% - 32px);
      max-width: 480px;
      padding: 13px 15px;
      border: 1px solid #efcbd3;
      border-radius: 15px;
      background: rgba(255, 248, 250, 0.98);
      color: #914052;
      box-shadow: 0 14px 36px rgba(111, 42, 59, 0.13);
      font-size: 13px;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 20px);
      transition: 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes pulse {
      50% {
        transform: scale(1.07);
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 700px) {
      .app {
        padding-top: 32px;
        padding-bottom: 42px;
      }

      .hero {
        min-height: 410px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand-label">AI 민원 안내 도우미</div>
        <h1>민원 음성상담</h1>
      </div>

      <div class="status-chip">
        <span class="status-dot"></span>
        상담 가능
      </div>
    </header>

    <section class="hero" id="hero">
      <p class="welcome-badge">편안하게 말씀해 주세요</p>
      <h2 class="hero-title">어떤 내용이 궁금하신가요?</h2>
      <p class="hero-copy">
        아래 마이크를 누르고 문의 내용을 말씀해 주세요.<br />
        인식된 내용은 직접 고칠 수도 있습니다.
      </p>

      <div class="orb-wrap">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>

        <button class="mic-button" id="micButton" aria-label="음성 입력 시작">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V20h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.08A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z" />
          </svg>
        </button>
      </div>

      <p class="state-text" id="stateText">상담을 시작할 준비가 되었습니다</p>
      <p class="state-sub" id="stateSub">마이크 버튼을 누르면 음성 인식이 시작됩니다.</p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title-wrap">
          <span class="panel-icon">✍️</span>
          <h2 class="panel-title">문의 내용</h2>
        </div>
        <span class="panel-help">말한 내용을 확인해 주세요</span>
      </div>

      <textarea
        id="questionInput"
        maxlength="1000"
        placeholder="음성으로 말씀하시거나 문의 내용을 직접 입력해 주세요."
      ></textarea>

      <button class="primary-action" id="sendButton">
        <span class="loader"></span>
        <span id="sendLabel">상담 답변 받기</span>
      </button>
    </section>

    <section class="panel answer" id="answerPanel" aria-live="polite">
      <div class="counselor-line">
        <div class="counselor-avatar" aria-hidden="true">💬</div>
        <div>
          <p class="counselor-name">상담 답변</p>
          <p class="counselor-status">문의하신 내용에 맞춰 안내해 드릴게요</p>
        </div>
      </div>

      <div class="answer-bubble">
        <p class="answer-body" id="answerBody"></p>
      </div>

      <div class="answer-actions">
        <button class="secondary-button" id="speakButton">▶ 답변 듣기</button>
        <button class="secondary-button stop" id="stopButton">■ 음성 정지</button>
      </div>

      <button class="secondary-button reset-button" id="resetButton">
        새로운 문의하기
      </button>
    </section>

    <p class="notice">
      현재는 시험 운영 중인 AI 안내 서비스입니다. 실제 접수나 처리 전에는 관련 규정과 담당 부서의 확인이 필요합니다.
    </p>
  </main>

  <div class="toast" id="toast" role="alert"></div>

  <script>
    const hero = document.getElementById("hero");
    const micButton = document.getElementById("micButton");
    const stateText = document.getElementById("stateText");
    const stateSub = document.getElementById("stateSub");
    const questionInput = document.getElementById("questionInput");
    const sendButton = document.getElementById("sendButton");
    const sendLabel = document.getElementById("sendLabel");
    const answerPanel = document.getElementById("answerPanel");
    const answerBody = document.getElementById("answerBody");
    const speakButton = document.getElementById("speakButton");
    const stopButton = document.getElementById("stopButton");
    const resetButton = document.getElementById("resetButton");
    const toast = document.getElementById("toast");

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let isListening = false;
    let toastTimer = null;
    let finalTranscript = "";

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    function setListening(active) {
      isListening = active;
      hero.classList.toggle("listening", active);

      micButton.setAttribute(
        "aria-label",
        active ? "음성 입력 종료" : "음성 입력 시작"
      );

      if (active) {
        stateText.textContent = "말씀을 듣고 있습니다";
        stateSub.textContent = "천천히 말씀해 주세요. 다시 누르면 종료됩니다.";
      } else {
        stateText.textContent = "상담을 시작할 준비가 되었습니다";
        stateSub.textContent = questionInput.value.trim()
          ? "인식된 문의 내용을 확인한 뒤 상담 답변을 받아보세요."
          : "마이크 버튼을 누르면 음성 인식이 시작됩니다.";
      }
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "ko-KR";
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        finalTranscript = "";
        setListening(true);
      };

      recognition.onresult = (event) => {
        let interimTranscript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            finalTranscript += transcript;
          } else {
            interimTranscript += transcript;
          }
        }

        questionInput.value = (finalTranscript + interimTranscript).trim();

        stateSub.textContent = interimTranscript
          ? `인식 중: ${interimTranscript}`
          : "음성 인식이 완료되었습니다. 문의 내용을 확인해 주세요.";
      };

      recognition.onerror = (event) => {
        setListening(false);

        const messages = {
          "not-allowed":
            "마이크 권한이 차단되었습니다. 브라우저 설정에서 마이크 사용을 허용해 주세요.",
          "no-speech":
            "음성이 들리지 않았습니다. 마이크 가까이에서 다시 말씀해 주세요.",
          "network":
            "음성 인식 연결에 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.",
          "audio-capture":
            "마이크를 사용할 수 없습니다. 기기의 마이크 상태를 확인해 주세요."
        };

        showToast(
          messages[event.error] ||
          "음성을 인식하지 못했습니다. 다시 시도해 주세요."
        );
      };

      recognition.onend = () => {
        setListening(false);
      };
    } else {
      stateText.textContent = "직접 입력으로 상담할 수 있습니다";
      stateSub.textContent =
        "이 브라우저에서는 음성 인식이 지원되지 않아 직접 입력을 이용해 주세요.";
    }

    micButton.addEventListener("click", () => {
      if (!recognition) {
        showToast(
          "이 브라우저는 음성 인식을 지원하지 않습니다. 문의 내용을 직접 입력해 주세요."
        );
        questionInput.focus();
        return;
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      try {
        recognition.start();
      } catch (error) {
        showToast("마이크를 잠시 기다린 뒤 다시 눌러 주세요.");
      }
    });

    async function sendQuestion() {
      const question = questionInput.value.trim();

      if (!question) {
        showToast("문의 내용을 말하거나 직접 입력해 주세요.");
        questionInput.focus();
        return;
      }

      window.speechSynthesis?.cancel();

      sendButton.disabled = true;
      sendButton.classList.add("loading");
      sendLabel.textContent = "답변을 준비하고 있습니다";
      stateText.textContent = "상담 답변을 준비하고 있습니다";
      stateSub.textContent = "문의 내용을 확인하고 있으니 잠시만 기다려 주세요.";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || "상담 답변을 준비하지 못했습니다."
          );
        }

        answerBody.textContent = data.answer;
        answerPanel.classList.add("show");

        stateText.textContent = "상담 답변이 준비되었습니다";
        stateSub.textContent =
          "아래에서 답변을 읽거나 음성으로 들어보세요.";

        answerPanel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      } catch (error) {
        stateText.textContent = "답변을 준비하지 못했습니다";
        stateSub.textContent = "잠시 후 다시 시도해 주세요.";
        showToast(error.message);
      } finally {
        sendButton.disabled = false;
        sendButton.classList.remove("loading");
        sendLabel.textContent = "상담 답변 받기";
      }
    }

    sendButton.addEventListener("click", sendQuestion);

    questionInput.addEventListener("input", () => {
      if (!isListening && questionInput.value.trim()) {
        stateSub.textContent =
          "문의 내용을 확인한 뒤 상담 답변을 받아보세요.";
      }
    });

    speakButton.addEventListener("click", () => {
      const text = answerBody.textContent.trim();

      if (!text || !("speechSynthesis" in window)) {
        showToast(
          "이 브라우저에서는 답변 음성 듣기를 사용할 수 없습니다."
        );
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ko-KR";
      utterance.rate = 0.94;
      utterance.pitch = 1;

      window.speechSynthesis.speak(utterance);
    });

    stopButton.addEventListener("click", () => {
      window.speechSynthesis?.cancel();
    });

    resetButton.addEventListener("click", () => {
      window.speechSynthesis?.cancel();

      if (isListening && recognition) {
        recognition.stop();
      }

      finalTranscript = "";
      questionInput.value = "";
      answerBody.textContent = "";
      answerPanel.classList.remove("show");

      stateText.textContent = "상담을 시작할 준비가 되었습니다";
      stateSub.textContent =
        "마이크 버튼을 누르면 음성 인식이 시작됩니다.";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
