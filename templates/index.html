<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06111f" />
  <title>AI 민원 음성상담</title>
  <style>
    :root {
      --bg: #030914;
      --panel: rgba(9, 25, 43, 0.78);
      --panel-strong: rgba(11, 31, 52, 0.96);
      --line: rgba(81, 213, 255, 0.23);
      --cyan: #40dcff;
      --blue: #4e83ff;
      --green: #55e6b2;
      --text: #eef8ff;
      --muted: #91a9bc;
      --danger: #ff7791;
      --shadow: 0 0 30px rgba(45, 190, 255, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(24, 121, 180, 0.19), transparent 35%),
        linear-gradient(180deg, #06111f 0%, var(--bg) 68%);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.13;
      background-image:
        linear-gradient(rgba(64, 220, 255, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64, 220, 255, 0.14) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    button, textarea { font: inherit; }

    button {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 520px);
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(22px, env(safe-area-inset-bottom));
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand-eyebrow {
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 0.18em;
      font-weight: 800;
    }

    h1 {
      margin: 5px 0 0;
      font-size: clamp(22px, 6vw, 30px);
      letter-spacing: -0.045em;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      background: rgba(6, 20, 34, 0.7);
      border-radius: 999px;
      padding: 8px 10px;
      color: #bceeff;
      font-size: 11px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(10, 31, 53, 0.9), rgba(4, 13, 25, 0.88));
      border-radius: 28px;
      min-height: 400px;
      padding: 28px 20px 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 18px var(--cyan);
    }

    .hero-label {
      margin: 0;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
    }

    .hero-title {
      margin: 8px 0 5px;
      font-size: 20px;
      letter-spacing: -0.03em;
    }

    .hero-copy {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .orb-wrap {
      position: relative;
      width: 210px;
      height: 210px;
      display: grid;
      place-items: center;
      margin: 15px 0 8px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(64, 220, 255, 0.24);
    }

    .ring.r1 { inset: 15px; animation: rotate 9s linear infinite; border-top-color: var(--cyan); }
    .ring.r2 { inset: 33px; animation: rotateReverse 7s linear infinite; border-right-color: var(--blue); }
    .ring.r3 { inset: 52px; border-color: rgba(64, 220, 255, 0.12); }

    .mic-button {
      position: relative;
      z-index: 3;
      width: 94px;
      height: 94px;
      border: 1px solid rgba(138, 235, 255, 0.78);
      border-radius: 50%;
      color: white;
      background:
        radial-gradient(circle at 50% 35%, rgba(72, 224, 255, 0.74), rgba(24, 95, 158, 0.94) 47%, #07192b 75%);
      box-shadow:
        0 0 0 10px rgba(64, 220, 255, 0.06),
        0 0 35px rgba(64, 220, 255, 0.48),
        inset 0 0 25px rgba(255,255,255,0.15);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .mic-button:active { transform: scale(.95); }

    .mic-button svg {
      width: 38px;
      height: 38px;
      fill: currentColor;
    }

    .hero.listening .ring {
      animation-duration: 1.5s;
      border-color: rgba(80, 229, 255, 0.65);
      box-shadow: 0 0 18px rgba(64, 220, 255, 0.3);
    }

    .hero.listening .mic-button {
      background: radial-gradient(circle at 50% 35%, #80f0ff, #1683c8 50%, #07192b 76%);
      box-shadow:
        0 0 0 14px rgba(64, 220, 255, 0.09),
        0 0 48px rgba(64, 220, 255, 0.74);
      animation: pulse 1.15s ease-in-out infinite;
    }

    .state-text {
      min-height: 22px;
      margin: 0;
      color: #d9f7ff;
      font-size: 14px;
      font-weight: 750;
    }

    .state-sub {
      margin: 7px 0 0;
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .primary-action {
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(64, 220, 255, 0.55);
      border-radius: 17px;
      margin-top: 15px;
      background: linear-gradient(90deg, rgba(25, 125, 198, .92), rgba(45, 101, 215, .92));
      color: white;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(29, 130, 211, 0.22);
      cursor: pointer;
    }

    .primary-action:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .panel {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-title {
      margin: 0;
      font-size: 14px;
      letter-spacing: -0.02em;
    }

    .panel-code {
      color: var(--cyan);
      font-size: 10px;
      letter-spacing: .12em;
    }

    textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid rgba(120, 206, 240, 0.19);
      border-radius: 16px;
      padding: 15px;
      outline: none;
      background: rgba(2, 10, 19, 0.64);
      color: var(--text);
      line-height: 1.55;
      font-size: 16px;
    }

    textarea:focus {
      border-color: rgba(64, 220, 255, 0.72);
      box-shadow: 0 0 0 3px rgba(64, 220, 255, 0.09);
    }

    textarea::placeholder { color: #647c90; }

    .answer {
      display: none;
    }

    .answer.show {
      display: block;
      animation: rise .35s ease both;
    }

    .answer-body {
      margin: 0;
      color: #e6f4ff;
      line-height: 1.78;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .answer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .secondary-button {
      min-height: 48px;
      border: 1px solid rgba(115, 202, 235, 0.25);
      border-radius: 14px;
      background: rgba(9, 34, 55, 0.86);
      color: #dff7ff;
      font-weight: 750;
      cursor: pointer;
    }

    .secondary-button.stop { color: #ffd9df; }

    .notice {
      margin: 14px 4px 0;
      color: #71899d;
      font-size: 11px;
      line-height: 1.55;
      text-align: center;
    }

    .loader {
      display: none;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,.28);
      border-top-color: white;
      border-radius: 50%;
      animation: rotate .8s linear infinite;
      vertical-align: -3px;
      margin-right: 7px;
    }

    .primary-action.loading .loader { display: inline-block; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      width: calc(100% - 32px);
      max-width: 480px;
      padding: 13px 15px;
      border: 1px solid rgba(255,119,145,.36);
      border-radius: 14px;
      background: rgba(45, 12, 23, .96);
      color: #ffe9ed;
      font-size: 13px;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes rotateReverse { to { transform: rotate(-360deg); } }
    @keyframes pulse {
      50% { transform: scale(1.07); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 700px) {
      .app { padding-top: 32px; padding-bottom: 40px; }
      .hero { min-height: 420px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand-eyebrow">SMART CIVIL ASSISTANT</div>
        <h1>AI 민원 음성상담</h1>
      </div>
      <div class="status-chip">
        <span class="status-dot"></span>
        SYSTEM READY
      </div>
    </header>

    <section class="hero" id="hero">
      <p class="hero-label">VOICE INTERFACE</p>
      <h2 class="hero-title">무엇을 도와드릴까요?</h2>
      <p class="hero-copy">마이크를 누르고 민원 내용을 말씀해주세요.</p>

      <div class="orb-wrap">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
        <button class="mic-button" id="micButton" aria-label="음성 입력 시작">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V20h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.08A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/>
          </svg>
        </button>
      </div>

      <p class="state-text" id="stateText">음성 상담 준비 완료</p>
      <p class="state-sub" id="stateSub">버튼을 누르면 음성 인식이 시작됩니다.</p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">인식된 질문</h2>
        <span class="panel-code">INPUT / 01</span>
      </div>

      <textarea
        id="questionInput"
        maxlength="1000"
        placeholder="음성으로 말하거나 직접 질문을 입력해주세요."
      ></textarea>

      <button class="primary-action" id="sendButton">
        <span class="loader"></span>
        <span id="sendLabel">AI 답변 생성</span>
      </button>
    </section>

    <section class="panel answer" id="answerPanel" aria-live="polite">
      <div class="panel-head">
        <h2 class="panel-title">AI 상담 답변</h2>
        <span class="panel-code">RESPONSE COMPLETE</span>
      </div>

      <p class="answer-body" id="answerBody"></p>

      <div class="answer-actions">
        <button class="secondary-button" id="speakButton">▶ 답변 듣기</button>
        <button class="secondary-button stop" id="stopButton">■ 음성 정지</button>
      </div>

      <button class="secondary-button" id="resetButton" style="width:100%; margin-top:10px;">
        다시 질문하기
      </button>
    </section>

    <p class="notice">
      현재는 시험용 AI 상담 서비스입니다. 실제 업무 처리 전 관련 규정과 담당 부서의 확인이 필요합니다.
    </p>
  </main>

  <div class="toast" id="toast" role="alert"></div>

  <script>
    const hero = document.getElementById("hero");
    const micButton = document.getElementById("micButton");
    const stateText = document.getElementById("stateText");
    const stateSub = document.getElementById("stateSub");
    const questionInput = document.getElementById("questionInput");
    const sendButton = document.getElementById("sendButton");
    const sendLabel = document.getElementById("sendLabel");
    const answerPanel = document.getElementById("answerPanel");
    const answerBody = document.getElementById("answerBody");
    const speakButton = document.getElementById("speakButton");
    const stopButton = document.getElementById("stopButton");
    const resetButton = document.getElementById("resetButton");
    const toast = document.getElementById("toast");

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let isListening = false;
    let toastTimer = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
    }

    function setListening(active) {
      isListening = active;
      hero.classList.toggle("listening", active);
      micButton.setAttribute(
        "aria-label",
        active ? "음성 입력 종료" : "음성 입력 시작"
      );

      if (active) {
        stateText.textContent = "듣고 있습니다";
        stateSub.textContent = "말씀을 마치면 자동으로 입력됩니다.";
      } else {
        stateText.textContent = "음성 상담 준비 완료";
        stateSub.textContent = "버튼을 누르면 음성 인식이 시작됩니다.";
      }
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "ko-KR";
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => setListening(true);

      recognition.onresult = (event) => {
        let finalText = "";
        let interimText = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += transcript;
          else interimText += transcript;
        }

        questionInput.value = finalText || interimText;
        stateSub.textContent = interimText
          ? `인식 중: ${interimText}`
          : "음성 인식이 완료되었습니다.";
      };

      recognition.onerror = (event) => {
        setListening(false);
        const messages = {
          "not-allowed": "마이크 권한이 차단되었습니다. 브라우저 설정에서 권한을 허용해주세요.",
          "no-speech": "음성이 들리지 않았습니다. 다시 시도해주세요.",
          "network": "음성 인식 네트워크 오류가 발생했습니다.",
        };
        showToast(messages[event.error] || "음성 인식 중 오류가 발생했습니다.");
      };

      recognition.onend = () => setListening(false);
    } else {
      stateText.textContent = "음성 인식 미지원";
      stateSub.textContent = "이 브라우저에서는 직접 입력을 이용해주세요.";
    }

    micButton.addEventListener("click", () => {
      if (!recognition) {
        showToast("이 브라우저는 음성 인식을 지원하지 않습니다. 질문을 직접 입력해주세요.");
        questionInput.focus();
        return;
      }

      if (isListening) recognition.stop();
      else {
        try {
          recognition.start();
        } catch (_) {
          showToast("음성 인식을 다시 시작해주세요.");
        }
      }
    });

    async function sendQuestion() {
      const question = questionInput.value.trim();

      if (!question) {
        showToast("질문을 말하거나 입력해주세요.");
        questionInput.focus();
        return;
      }

      window.speechSynthesis?.cancel();
      sendButton.disabled = true;
      sendButton.classList.add("loading");
      sendLabel.textContent = "질문 분석 중";
      stateText.textContent = "AI가 답변을 생성하고 있습니다";
      stateSub.textContent = "질문 내용을 안전하게 분석하고 있습니다.";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "답변 생성에 실패했습니다.");
        }

        answerBody.textContent = data.answer;
        answerPanel.classList.add("show");
        stateText.textContent = "답변 생성이 완료되었습니다";
        stateSub.textContent = "아래 답변을 확인하거나 음성으로 들어보세요.";
        answerPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) {
        stateText.textContent = "답변을 생성하지 못했습니다";
        stateSub.textContent = "잠시 후 다시 시도해주세요.";
        showToast(error.message);
      } finally {
        sendButton.disabled = false;
        sendButton.classList.remove("loading");
        sendLabel.textContent = "AI 답변 생성";
      }
    }

    sendButton.addEventListener("click", sendQuestion);

    speakButton.addEventListener("click", () => {
      const text = answerBody.textContent.trim();
      if (!text || !("speechSynthesis" in window)) {
        showToast("이 브라우저에서는 음성 읽기를 사용할 수 없습니다.");
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ko-KR";
      utterance.rate = 0.96;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    });

    stopButton.addEventListener("click", () => {
      window.speechSynthesis?.cancel();
    });

    resetButton.addEventListener("click", () => {
      window.speechSynthesis?.cancel();
      questionInput.value = "";
      answerBody.textContent = "";
      answerPanel.classList.remove("show");
      stateText.textContent = "음성 상담 준비 완료";
      stateSub.textContent = "버튼을 누르면 음성 인식이 시작됩니다.";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
